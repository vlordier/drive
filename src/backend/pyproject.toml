#
# drive package
#
[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "drive"
version = "0.13.0"
authors = [{ "name" = "DINUM", "email" = "dev@mail.numerique.gouv.fr" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
description = "An application managing files in a workspace."
keywords = ["Django", "Contacts", "Templates", "RBAC"]
license = "MIT"
requires-python = "~=3.13.0"
dependencies = [
    # Use >= for flexibility, exact versions in uv.lock
    "boto3>=1.42.19",
    "Brotli>=1.1.0",
    "dj-database-url>=3.0.1",
    "celery[redis]>=5.6.0",
    "defusedxml>=0.7.1",
    "django<6.0.0",
    "django-configurations>=2.5.1",
    "django-cors-headers>=4.9.0",
    "django-countries>=8.2.0",
    "django-filter>=25.2",
    "django-lasuite[all]>=0.0.23",
    "django-ltree>=0.6.0",
    "django-parler>=2.3",
    "django-redis>=6.0.0",
    "django-storages[s3]>=1.14.0",
    "django-timezone-field>=5.1",
    "djangorestframework>=3.16.0",
    "djangorestframework-api-key>=3.1.0",
    "dockerflow>=2024.4.2",
    "drf_spectacular>=0.29.0",
    "drf-standardized-errors>=0.15.0",
    "easy_thumbnails>=2.10.0",
    "factory_boy>=3.3.0",
    "gunicorn>=23.0.0",
    "jsonschema>=4.25.0",
    "markdown>=3.10",
    "mozilla-django-oidc>=4.0.1",
    "nested-multipart-parser>=1.6.0",
    "posthog>=7.4.0",
    "psycopg[binary]>=3.3.0",
    "PyJWT>=2.10.0",
    "python-magic>=0.4.27",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "sentry-sdk>=2.48.0",
    "url-normalize>=2.2.0",
    "whitenoise>=6.11.0",
]

[project.urls]
"Bug Tracker" = "https://github.com/suitenumerique/drive/issues/new"
"Changelog" = "https://github.com/suitenumerique/drive/blob/main/CHANGELOG.md"
"Homepage" = "https://github.com/suitenumerique/drive"
"Repository" = "https://github.com/suitenumerique/drive"

[project.optional-dependencies]
dev = [
    # Use >= for flexibility, exact versions in uv.lock
    "django-debug-toolbar>=6.1.0",
    "django-extensions>=4.1",
    "drf-spectacular-sidecar>=2025.12.0",
    "freezegun>=1.5.0",
    "ipdb>=0.13.0",
    "ipython>=9.0.0",
    "mypy>=1.14.0",
    "mypy[django-plugin]>=1.14.0",
    "django-stubs>=5.0.0",
    "pyfakefs>=6.0.0",
    "pylint-django>=2.7.0",
    "pylint>=4.0.0",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.0",
    "pytest>=9.0.0",
    "pytest-icdiff>=0.9",
    "pytest-xdist>=3.8.0",
    "responses>=0.25.0",
    "ruff>=0.14.0",
    "types-requests>=2.32.0",
    # Security tools - handled by Dependabot
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "semgrep>=1.80.0",
]

[tool.uv.build-backend]
module-root = ""
source-exclude = [
    "**/tests/**",
    "**/test_*.py",
    "**/tests.py",
]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "build",
    "venv",
    "__pycache__",
    "*/migrations/*",
]
line-length = 88


[tool.ruff.lint]
# Security-focused linting only (OWASP)
ignore = [
    "S101", # Use of assert detected (allowed in tests)
    "S105", # Possible hardcoded password string
    "S106", # Possible hardcoded password function argument
    "S107", # Hardcoded password in function call
]
select = [
    "S", # flake8-bandit (security) - OWASP focused
    "RUF200", # Ruff check pyproject.toml
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S"]

[tool.pytest.ini_options]
addopts = [
    "-v",
    "--cov-report",
    "term-missing",
    # Allow test files to have the same name in different directories.
    "--import-mode=importlib",
]
python_files = [
    "test_*.py",
    "tests.py",
]

[tool.bandit]
exclude = [
    ".git",
    ".venv",
    "build",
    "venv",
    "__pycache__",
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
]
skips = [
    "B101", # assert_used - tests use assert
    "B105", # hardcoded_password_string - test fixtures and Bearer token
    "B106", # hardcoded_password_funcarg - test fixtures and management commands
    "B608", # hardcoded_sql_expressions - test fixtures
]

[tool.semgrep]
exclude = [
    ".git",
    ".venv",
    "build",
    "venv",
    "__pycache__",
    "*/migrations/*",
    "*/tests/*",
]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
follow_imports = "skip"
ignore_missing_imports = true
warn_unreachable = false
strict_equality = false
disable_error_code = [
    "no-any-return",
    "assignment",
    "return-value",
    "arg-type",
    "var-annotated",
    "misc",
    "attr-defined",
    "no-redef",
    "union-attr",
    "operator",
    "dict-item",
    "truthy-function",
]

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rest_framework.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_ltree.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lasuite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "drf_spectacular.*"
ignore_missing_imports = true
