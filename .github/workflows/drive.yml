name: Main Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL for ZAP scan (e.g., https://staging.example.com)'
        required: false
        default: ''

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  lint-git:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # Makes sense only for pull requests
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4
        with:
          fetch-depth: 0
      - name: show
        run: git log
      - name: Enforce absence of print statements in code
        if: always()
        run: |
          ! git diff origin/${{ github.event.pull_request.base.ref }}..HEAD -- . ':(exclude)**/drive.yml' | grep "print("
      - name: Check absence of fixup commits
        if: always()
        run: |
          ! git log | grep 'fixup!'
      - name: Install gitlint
        if: always()
        run: pip install --user requests gitlint
      - name: Lint commit messages added to main
        if: always()
        run: ~/.local/bin/gitlint --commits origin/${{ github.event.pull_request.base.ref }}..HEAD
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@e7ff8cd18e367b48c0ad7ed9e8666d055c0e3edf
        with:
          path: ./
          base: ${{ github.event.pull_request.base_ref }}
          head: HEAD
          extra_args: --filter-entropy --no-update
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@6e0430d1cfc95ed278f0cc3b5e5e3fc5e32a8f80
        with:
          scanpath: "bin/"
          severity: "error"
      - name: Run ShellCheck on helm scripts
        uses: ludeeus/action-shellcheck@6e0430d1cfc95ed278f0cc3b5e5e3fc5e32a8f80
        with:
          scanpath: "src/helm/drive/"
          severity: "error"

  check-changelog:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.labels.*.name, 'noChangeLog') == false &&
      github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4
        with:
          fetch-depth: 50
      - name: Check that the CHANGELOG has been modified in the current branch
        run: git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.after }} | grep 'CHANGELOG.md'

  lint-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4
      - name: Check CHANGELOG max line length
        run: |
          max_line_length=$(cat CHANGELOG.md | grep -Ev "^\[.*\]: https://github.com" | wc -L)
          if [ $max_line_length -ge 80 ]; then
            echo "ERROR: CHANGELOG has lines longer than 80 characters."
            exit 1
          fi

  build-mails:
    uses: ./.github/workflows/build-mails.yml

  lint-back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4
      - name: "Set up Python"
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version-file: "src/backend/pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@5a8a1669a6e4e9f0a5ab86ff4f2e9bd2d6c61e7e
      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Check code formatting with ruff
        run: uv run ruff format . --diff
      - name: Lint code with ruff
        run: uv run ruff check .
      - name: Lint code with pylint
        run: uv run pylint .

  test-back:
    runs-on: ubuntu-latest
    needs: build-mails

    defaults:
      run:
        working-directory: src/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drive
          POSTGRES_USER: dinum
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DJANGO_CONFIGURATION: Test
      DJANGO_SETTINGS_MODULE: drive.settings
      DJANGO_SECRET_KEY: ThisIsAnExampleKeyForTestPurposeOnly
      OIDC_OP_JWKS_ENDPOINT: /endpoint-for-test-purpose-only
      DJANGO_EMAIL_HOST: mailcatcher
      DB_HOST: localhost
      DB_NAME: drive
      DB_USER: dinum
      DB_PASSWORD: pass
      DB_PORT: 5432
      STORAGES_STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage
      AWS_S3_ENDPOINT_URL: http://localhost:9000
      AWS_S3_ACCESS_KEY_ID: drive
      AWS_S3_SECRET_ACCESS_KEY: password
      AWS_S3_REGION_NAME: eu-east-1
      MEDIA_BASE_URL: http://localhost:8083

    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: Create writable /data
        run: |
          sudo mkdir -p /data/media && \
          sudo mkdir -p /data/static

      - name: Restore the mail templates
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        id: mail-templates
        with:
          path: "src/backend/core/templates/mail"
          key: mail-templates-${{ hashFiles('src/mail/mjml') }}

      - name: Start MinIO
        run: |
          docker pull minio/minio
          docker run -d --name minio \
            -p 9000:9000 \
            -e "MINIO_ACCESS_KEY=drive" \
            -e "MINIO_SECRET_KEY=password" \
            -v /data/media:/data \
            minio/minio server --console-address :9001 /data

      # Tool to wait for a service to be ready
      - name: Install Dockerize
        run: |
          curl -sSL https://github.com/jwilder/dockerize/releases/download/v0.8.0/dockerize-linux-amd64-v0.8.0.tar.gz | sudo tar -C /usr/local/bin -xzv

      - name: Wait for MinIO to be ready
        run: |
          dockerize -wait tcp://localhost:9000 -timeout 10s

      - name: Configure MinIO
        run: |
          MINIO=$(docker ps | grep minio/minio | sed -E 's/.*\s+([a-zA-Z0-9_-]+)$/\1/')
          docker exec ${MINIO} sh -c \
            "mc alias set drive http://localhost:9000 drive password && \
            mc alias ls && \
            mc mb drive/drive-media-storage && \
            mc version enable drive/drive-media-storage"

      - name: "Set up Python"
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version-file: "src/backend/pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@5a8a1669a6e4e9f0a5ab86ff4f2e9bd2d6c61e7e
      - name: Install the dependencies
        run: uv sync --locked --all-extras

      - name: Install gettext (required to compile messages) and MIME support
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext pandoc shared-mime-info
          sudo wget https://raw.githubusercontent.com/suitenumerique/django-lasuite/refs/heads/main/assets/conf/mime.types -O /etc/mime.types

      - name: Generate a MO file from strings extracted from the project
        run: uv run python manage.py compilemessages

      - name: Run tests
        run: uv run pytest -n 2

  security-scan:
    runs-on: ubuntu-latest
    needs: build-mails
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version-file: "src/backend/pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@5a8a1669a6e4e9f0a5ab86ff4f2e9bd2d6c61e7e

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run Bandit security scan
        run: uv run bandit -r core/ -x B101,B105,B106,B608 -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run pip-audit for dependency vulnerabilities
        run: uv run pip-audit --format=json -o pip-audit-report.json || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 7

  codeql:
    runs-on: ubuntu-latest
    needs: lint-back
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e7c5b0398166b4b2c0aa8443a7e5c1f0ecb94f3
        with:
          languages: python, javascript, typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@4e7c5b0398166b4b2c0aa8443a7e5c1f0ecb94f3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4e7c5b0398166b4b2c0aa8443a7e5c1f0ecb94f3
        with:
          category: "/language:python,javascript,typescript"

  container-scan:
    runs-on: ubuntu-latest
    needs: lint-back
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b76c4fb6d5c4f5d31b6e6a7c8a0e9b7c4d

      - name: Build Docker image
        uses: docker/build-push-action@59c4e8621c2d68f4f1e1a1a5e7d5e8f0a2b3c4d5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: drive:latest
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@be41c9c7d2e1e56f7b18b00d3b3c9c9e74c4f7d3
        with:
          image-ref: 'drive:latest'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 7

  zap-api-scan:
    runs-on: ubuntu-latest
    # Run manually via workflow_dispatch
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.8.0
        with:
          target: ${{ github.event.inputs.target_url || 'https://your-staging-url.com/api/' }}
          format: json
          output: zap-api-report.json
        continue-on-error: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zap-api-report
          path: zap-api-report.json
          retention-days: 7

  zap-baseline-scan:
    runs-on: ubuntu-latest
    # Run manually via workflow_dispatch
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: ${{ github.event.inputs.target_url || 'https://your-staging-url.com' }}
          format: json
          output: zap-baseline-report.json
        continue-on-error: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zap-baseline-report
          path: zap-baseline-report.json
          retention-days: 7
