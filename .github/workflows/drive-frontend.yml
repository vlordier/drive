name: Frontend Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  install-front:
    uses: ./.github/workflows/front-dependencies-installation.yml
    with:
      node_version: "22.x"

  build-mails:
    uses: ./.github/workflows/build-mails.yml

  lint-front:
    runs-on: ubuntu-latest
    needs: install-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: Setup Node.js
        uses: actions/setup-node@0a44e2d8ea4b20b80c5e4e1e5d5e0f5d0c3b8a6b
        with:
          node-version: "22.x"
      - name: Restore the frontend cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Check linting
        run: cd src/frontend/ && yarn lint

  security-front:
    runs-on: ubuntu-latest
    needs: install-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: Setup Node.js
        uses: actions/setup-node@0a44e2d8ea4b20b80c5e4e1e5d5e0f5d0c3b8a6b
        with:
          node-version: "22.x"

      - name: Restore the frontend cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Run npm audit
        run: |
          cd src/frontend/apps/drive
          yarn audit --audit-level=moderate || true
        continue-on-error: true

      - name: Run npm audit for production dependencies
        run: |
          cd src/frontend/apps/drive
          yarn audit --audit-level=high || true
        continue-on-error: true

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@4fa6a1e2e7ef7d4a2b5d5e6f8a7c9d0e1f2a3b4c  # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

  test-unit:
    runs-on: ubuntu-latest
    needs: install-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: Setup Node.js
        uses: actions/setup-node@0a44e2d8ea4b20b80c5e4e1e5d5e0f5d0c3b8a6b
        with:
          node-version: "22.x"

      - name: Restore the frontend cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Run unit tests
        run: |
          cd src/frontend/apps/drive
          yarn test

  test-e2e:
    runs-on: ubuntu-latest
    needs: [install-front, build-mails]
    strategy:
      matrix:
        browser:
          - chromium
          - webkit
          - firefox
    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336abcc1843dd5c3f5f8e2c90dae4

      - name: Setup Node.js
        uses: actions/setup-node@0a44e2d8ea4b20b80c5e4e1e5d5e0f5d0c3b8a6b
        with:
          node-version: "22.x"

      - name: Restore the frontend cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: "src/frontend/**/node_modules"
          key: front-node_modules-${{ hashFiles('src/frontend/**/yarn.lock') }}
          fail-on-cache-miss: true

      - name: Restore the mail templates
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: "src/backend/core/templates/mail"
          key: mail-templates-${{ hashFiles('src/mail/mjml') }}

      - name: Install Playwright Browsers
        run: |
          cd src/frontend/apps/e2e
          npx playwright install --with-deps ${{matrix.browser}}

      - name: Start Docker services
        run: |
          make bootstrap-e2e

      - name: Start frontend
        run: |
          cd src/frontend && yarn dev &

      - name: Wait for Keycloak to be ready
        run: |
          timeout 30 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8083/)" != "302" ]]; do echo "Waiting for Keycloak..." && sleep 2; done' && echo "Keycloak is ready!"

      - name: Run e2e tests
        run: |
          cd src/frontend/apps/e2e
          yarn test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-${{ matrix.browser }}
          path: src/frontend/apps/e2e/report/
          retention-days: 7